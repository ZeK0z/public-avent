<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Avent" />
<meta name="theme-color" content="#2a160c" />
<title>Avent</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<style>
:root{--bg1:#2a160c;--bg2:#5a2e17;--gold:#f2b84b;--gold2:#ffe3a3;--ink:#fff6e8;--mute:#e0c3a3;--icing:#fff6e8;--card:rgba(255,240,220,.08);--line:rgba(255,230,200,.22);--ok:#8fd19e;--bad:#ff9b8a;--duo:#8fd19e;--carre:#f0a35e;--cash:#ff6b5b;--red:#b3262e;--ginger:#a4602f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
 background:
  radial-gradient(2px 2px at 12% 8%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 78% 14%,#fff7 50%,transparent 51%),
  radial-gradient(2px 2px at 40% 30%,#fff5 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 46%,#fff6 50%,transparent 51%),
  radial-gradient(2px 2px at 22% 62%,#fff4 50%,transparent 51%),radial-gradient(1.5px 1.5px at 64% 78%,#fff5 50%,transparent 51%),
  radial-gradient(2px 2px at 8% 90%,#fff4 50%,transparent 51%),
  radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%) fixed;background-color:var(--bg1)}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 72px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.score{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:6px 10px;border-radius:14px;background:var(--red);border:2px dashed var(--icing);box-shadow:0 3px 0 #6e1218}
.score .pts{font-size:22px;font-weight:800;color:var(--icing)}.score small{font-size:11px;color:#ffd9cf}
.progress{position:relative;flex:1;height:34px;border-radius:17px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.progress div{height:100%;background:repeating-linear-gradient(-45deg,var(--red) 0 10px,var(--icing) 10px 20px);transition:width .6s}
.progress span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink);text-shadow:0 0 4px #000,0 1px 2px #000}
.clue-btn{position:relative;padding:8px 12px;border-radius:14px;background:#2f5d3a;border:2px dashed var(--icing);color:var(--icing);font-weight:700;box-shadow:0 3px 0 #1b3a22}
.clue-btn i{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--bg1)}
.garland{height:18px;margin:2px -16px 4px;background:radial-gradient(circle at 10px 6px,var(--red) 4px,transparent 5px) 0 0/40px 18px,radial-gradient(circle at 30px 6px,var(--gold) 4px,transparent 5px) 0 0/40px 18px,radial-gradient(ellipse 22px 10px at 20px -2px,transparent 9px,#2f5d3a 10px,#2f5d3a 11px,transparent 12px) 0 0/40px 18px}
h1{margin:6px 0 2px;font:italic 700 30px/1.15 Georgia,"Times New Roman",serif;text-align:center;color:var(--icing);text-shadow:0 2px 0 var(--red),0 0 18px #f2b84b55}
.sub{text-align:center;color:var(--mute);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{aspect-ratio:1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,#b06a35,var(--ginger) 60%,#8a4d24);border:2px dashed #fff3e0bb;outline:4px solid #8a4d24;outline-offset:-1px;box-shadow:0 4px 0 #5e3216}
.cell b{font:700 24px Georgia,serif;color:var(--icing);text-shadow:0 1px 0 #5e3216}.cell small{font-size:12px;color:#ffe9d0}
.cell.open{background:linear-gradient(160deg,#d43a3f,var(--red));outline-color:var(--red);box-shadow:0 4px 0 #6e1218,0 0 0 3px var(--gold);animation:pulse 2.4s infinite}
.cell.solved{background:linear-gradient(160deg,#3f7a4c,#2f5d3a);outline-color:#2f5d3a;box-shadow:0 4px 0 #1b3a22}.cell.solved small{color:var(--gold2);font-weight:800}
.cell.locked{filter:saturate(.6) brightness(.7)}
@keyframes pulse{50%{box-shadow:0 4px 0 #6e1218,0 0 0 7px #f2b84b55}}
.link{color:var(--mute);padding:8px 0;font-size:14px}.back{display:block}
.day .date{color:var(--gold);margin:6px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
h2{font-size:22px;line-height:1.3;margin:4px 0 22px}
.hint{color:var(--mute);text-align:center}.bad{color:var(--bad);font-weight:700}
.modes{display:grid;gap:12px}
.mode{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-radius:18px;font-size:20px;font-weight:800;border:2px solid currentColor;background:var(--card)}
.mode b{font-size:16px}.mode.duo{color:var(--duo)}.mode.carre{color:var(--carre)}.mode.cash{color:var(--icing);background:linear-gradient(160deg,#d43a3f,var(--red));border:2px dashed var(--icing);box-shadow:0 4px 0 #6e1218}
.opts{display:grid;gap:12px}
.opt{padding:18px;border-radius:16px;background:linear-gradient(160deg,#b06a35,var(--ginger));border:2px dashed #fff3e0aa;font-size:18px;font-weight:700;text-align:left;box-shadow:0 4px 0 #5e3216}
.opt:active,.mode:active{transform:translateY(2px)}
.cash-form{display:grid;gap:12px}
.cash-form input{padding:16px;border-radius:14px;border:2px solid var(--gold);background:#0006;color:var(--ink);font:inherit;font-size:18px}
.primary{padding:16px;border-radius:16px;background:linear-gradient(var(--gold2),var(--gold));color:#4a2208;font-weight:800;font-size:17px;width:100%;box-shadow:0 4px 0 #a8741c}
.result{text-align:center;padding-top:20px}
.burst{font:900 64px Georgia,serif;color:var(--gold);text-shadow:0 3px 0 var(--red),0 0 30px #f2b84b88;animation:pop .5s}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.clue{padding:16px 18px;border-radius:16px;background:var(--icing);color:#4a2208;border:2px solid var(--red);margin-bottom:12px;text-align:left;box-shadow:0 4px 0 #a4602f}
.clue small{color:var(--red);text-transform:uppercase;font-size:11px;letter-spacing:1px;font-weight:800}.clue p{margin:6px 0 0;font:italic 20px Georgia,serif}
.clue.locked{background:var(--card);color:var(--mute);border:2px dashed var(--line);box-shadow:none}.clue.locked small{color:var(--gold)}
.clue.locked p{font:15px -apple-system,system-ui,sans-serif}.clue.new{animation:pop .6s}
.result .primary{margin-top:18px}
.install{text-align:center;padding-top:60px}.share{font-size:48px;color:var(--gold)}.install p{color:var(--mute)}

.rules{display:block;margin:8px auto 0;text-decoration:underline}
.my-clues{display:block;width:100%;margin-top:18px;padding:14px;border-radius:16px;background:#2f5d3a;border:2px dashed var(--icing);color:var(--icing);font-weight:800;font-size:17px;box-shadow:0 4px 0 #1b3a22}
.tuto{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:24px;background:#1a0c05cc;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.tuto-card{width:100%;max-width:380px;padding:24px 22px 20px;border-radius:22px;background:var(--icing);color:#4a2208;border:3px dashed var(--red);box-shadow:0 6px 0 var(--ginger);text-align:center;animation:pop .35s}
.tuto-card h2{margin:0 0 10px;font:italic 700 24px Georgia,serif;color:var(--red)}
.tuto-card p{margin:0 0 18px;font-size:17px;line-height:1.45}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.dots i{width:9px;height:9px;border-radius:50%;background:#d9b99a}.dots i.on{background:var(--red)}
#sim{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;justify-content:center;padding:8px calc(env(safe-area-inset-bottom) + 8px);background:#000c;border-top:1px dashed #ff8a8a;font-size:13px;z-index:9}
#sim b{color:var(--bad)}#sim input,#sim button{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid #555;background:#222;color:#eee}
</style>
</head>

<div id="app"></div>
